
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ETERNAL FRONT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071522;color:white;font-family:Arial;overflow:hidden}
canvas{display:block;width:100vw;height:100dvh}
#menu{position:fixed;inset:0;background:#071522ed;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.panel{max-width:440px;border:1px solid #63cfff;padding:28px;border-radius:16px;background:#0b2133}
h1{font-size:42px;margin:10px;color:#fff}
p{line-height:1.6;color:#c4d8e7}
button{background:#76dcff;color:#071522;border:0;border-radius:9px;padding:16px;font-weight:bold;font-size:16px}
#launch{width:100%}
#hud{position:fixed;top:10px;left:10px;font-weight:bold;text-shadow:0 1px 4px black}
#controls{position:fixed;bottom:20px;left:0;right:0;display:none;justify-content:space-between;padding:12px}
#controls button{width:60px;height:60px;border-radius:50%;background:#12364ddd;color:white;border:1px solid white}
#fire{background:#b82d39!important}
@media(hover:none){#controls{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">ETERNAL FRONT<br>SCORE: <span id="score">0</span><br>HEALTH: <span id="hp">100</span>%</div>
<div id="controls">
<div><button id="left">◀</button><button id="right">▶</button></div>
<div><button id="up">▲</button><button id="down">▼</button><button id="fire">FIRE</button></div>
</div>
<div id="menu">
<div class="panel">
<p>TACTICAL AIR COMMAND</p>
<h1>ETERNAL<br>FRONT</h1>
<b>CHAPTER 1: IN THE LINE OF DUTY</b>
<p>Launch your fighter. Destroy hostile aircraft. Survive the sortie.</p>
<button id="launch">LAUNCH SORTIE</button>
<p>Touch controls on iPhone. Arrow keys and SPACE on computer.</p>
</div>
</div>
<script>
const c=document.getElementById("game"),x=c.getContext("2d");
let w,h,playing=false,score=0,hp=100,keys={},bullets=[],enemies=[],last=0;
const p={x:0,y:0};
function size(){w=c.width=innerWidth;h=c.height=innerHeight;p.x=w/2;p.y=h*.75}
size();addEventListener("resize",size);
function jet(a,b,s,color){
x.save();x.translate(a,b);x.scale(s,s);x.fillStyle=color;
x.beginPath();x.moveTo(0,-24);x.lineTo(5,-5);x.lineTo(23,12);x.lineTo(6,8);x.lineTo(5,21);x.lineTo(11,25);x.lineTo(0,22);x.lineTo(-11,25);x.lineTo(-5,21);x.lineTo(-6,8);x.lineTo(-23,12);x.lineTo(-5,-5);x.closePath();x.fill();
x.fillStyle="#8ceaff";x.fillRect(-2,-14,4,9);x.restore()
}
function start(){score=0;hp=100;bullets=[];enemies=[];p.x=w/2;p.y=h*.75;playing=true;document.getElementById("menu").style.display="none";last=performance.now();requestAnimationFrame(loop)}
document.getElementById("launch").onclick=start;
["left","right","up","down","fire"].forEach(k=>{
let b=document.getElementById(k);
b.onpointerdown=e=>{e.preventDefault();keys[k]=true};
b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys[k]=false;
});
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);
function loop(t){
if(!playing)return;
let dt=Math.min((t-last)/16.67,2);last=t;
let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,"#102b4a");g.addColorStop(.5,"#39758a");g.addColorStop(1,"#073044");x.fillStyle=g;x.fillRect(0,0,w,h);
x.fillStyle="#183e4d";x.beginPath();x.moveTo(0,h*.4);for(let a=0;a<=w;a+=25)x.lineTo(a,h*.36+Math.sin(a*.02+t*.0003)*20);x.lineTo(w,h);x.lineTo(0,h);x.fill();
if(keys.left||keys.ArrowLeft||keys.KeyA)p.x-=5*dt;
if(keys.right||keys.ArrowRight||keys.KeyD)p.x+=5*dt;
if(keys.up||keys.ArrowUp||keys.KeyW)p.y-=4*dt;
if(keys.down||keys.ArrowDown||keys.KeyS)p.y+=4*dt;
p.x=Math.max(20,Math.min(w-20,p.x));p.y=Math.max(h*.3,Math.min(h-45,p.y));
if((keys.fire||keys.Space)&&t%110<20)bullets.push({x:p.x,y:p.y-25});
if(Math.random()<.025&&enemies.length<6)enemies.push({x:30+Math.random()*(w-60),y:-25,s:1+Math.random()});
bullets.forEach(b=>{b.y-=9*dt;x.fillStyle="#b8f6ff";x.fillRect(b.x-2,b.y,4,13)});
enemies.forEach((e,i)=>{e.y+=e.s*dt;jet(e.x,e.y,.8,"#d8dce0");bullets.forEach((b,j)=>{if(Math.hypot(b.x-e.x,b.y-e.y)<23){e.dead=true;b.dead=true;score+=100}});if(Math.hypot(p.x-e.x,p.y-e.y)<28){e.dead=true;hp-=15}if(e.y>h){e.dead=true;hp-=5}});
enemies=enemies.filter(e=>!e.dead);bullets=bullets.filter(b=>!b.dead&&b.y>-20);
jet(p.x,p.y,1.15,"#eef7ff");
document.getElementById("score").textContent=score;
document.getElementById("hp").textContent=Math.max(0,hp);
if(hp<=0){playing=false;document.querySelector("#menu h1").innerHTML="SORTIE<br>FAILED";document.querySelector("#menu p:nth-of-type(2)").textContent="Your aircraft was lost. Try another sortie.";document.getElementById("launch").textContent="REDEPLOY";document.getElementById("menu").style.display="flex";return}
requestAnimationFrame(loop)
}
</script>
</body>
</html>
